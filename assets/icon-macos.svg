<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Authentic Apple HIG macOS squircle drop shadow -->
    <filter id="dockShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000000" flood-opacity="0.48" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.32" />
    </filter>

    <!-- Rich obsidian-graphite squircle fill -->
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2B27" />
      <stop offset="50%" stop-color="#1A1917" />
      <stop offset="100%" stop-color="#11100E" />
    </linearGradient>

    <!-- Subtle top glass sheen -->
    <linearGradient id="topSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Inner edge rim highlight -->
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>

    <!-- Warm amber studio halo behind play glyph -->
    <radialGradient id="amberHalo" cx="50%" cy="43%" r="42%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.34" />
      <stop offset="60%" stop-color="#E89E38" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#E89E38" stop-opacity="0" />
    </radialGradient>

    <!-- Luminous amber-gold play glyph -->
    <linearGradient id="playGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFE09E" />
      <stop offset="40%" stop-color="#F7AF3E" />
      <stop offset="100%" stop-color="#D97B12" />
    </linearGradient>

    <!-- Primary subtitle bar -->
    <linearGradient id="barPrimary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFCA70" />
      <stop offset="100%" stop-color="#E38A1C" />
    </linearGradient>

    <!-- Glyph elevation shadow -->
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.52" />
    </filter>

    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="186" ry="186" />
    </clipPath>
  </defs>

  <!-- macOS HIG 824x824 squircle centered on transparent 1024x1024 canvas -->
  <g filter="url(#dockShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#squircleBg)" />
  </g>

  <g clip-path="url(#squircleClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#amberHalo)" />
    <rect x="100" y="100" width="824" height="824" fill="url(#topSheen)" />

    <!-- Center motif: Play triangle + dual bilingual subtitle bars -->
    <g filter="url(#glyphShadow)">
      <path
        d="M 404 282
           C 404 252, 437 234, 463 250
           L 678 384
           C 702 399, 702 435, 678 450
           L 463 584
           C 437 600, 404 582, 404 552
           Z"
        fill="url(#playGrad)"
      />
      <rect x="292" y="652" width="440" height="44" rx="22" fill="url(#barPrimary)" />
      <rect x="366" y="720" width="292" height="36" rx="18" fill="#F5EFE6" fill-opacity="0.78" />
    </g>
  </g>

  <!-- Crisp 2.5px glass rim border -->
  <rect
    x="101.5"
    y="101.5"
    width="821"
    height="821"
    rx="185"
    ry="185"
    fill="none"
    stroke="url(#rimStroke)"
    stroke-width="3"
  />
</svg>
