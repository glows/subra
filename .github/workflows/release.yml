name: Release Subra

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-macos:
    name: Package macOS (arm64)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSH CLI
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"

      - name: Check & Package macOS app
        run: |
          nsh check
          nsh package --target macos --arch arm64 --out dist
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Subra.app Subra-macos-arm64.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Subra-macos-arm64
          path: dist/Subra-macos-arm64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "Subra ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/Subra-macos-arm64.zip --clobber

  package-windows:
    name: Package Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSH CLI
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          echo "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check & Package Windows app
        shell: pwsh
        run: |
          nsh check
          nsh package --target windows --out dist
          $zip = Get-ChildItem -Path dist -Filter *.zip | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName dist\Subra-windows-x64.zip -Force
          } else {
            Compress-Archive -Path dist\Subra\* -DestinationPath dist\Subra-windows-x64.zip -Force
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Subra-windows-x64
          path: dist/Subra-windows-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --title "Subra $env:GITHUB_REF_NAME" --generate-notes
          }
          gh release upload "$env:GITHUB_REF_NAME" dist\Subra-windows-x64.zip --clobber
